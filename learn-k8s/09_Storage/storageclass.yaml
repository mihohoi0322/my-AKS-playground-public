apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: azurefile-csi-nfs
provisioner: file.csi.azure.com
allowVolumeExpansion: true
parameters:
  protocol: nfs
  skuName: PremiumV2_LRS
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nconnect=4
  - noresvport
  - actimeo=30