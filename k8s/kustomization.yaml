apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hrsystem

resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 20-redis.yaml
  - 30-employee-service.yaml
  - 31-attendance-service.yaml
  - 32-organization-service.yaml
  - 40-api-gateway.yaml
  - 50-web-ui.yaml

commonLabels:
  app.kubernetes.io/part-of: hrsystem
  app.kubernetes.io/managed-by: kustomize

# Pin image tags here per environment, e.g. via `kustomize edit set image`
# or by overriding in an overlay (overlays/prod/kustomization.yaml).
images:
  - name: ghcr.io/mihohoi0322/hrsystem-api-gateway
    newTag: latest
  - name: ghcr.io/mihohoi0322/hrsystem-web-ui
    newTag: latest
  - name: ghcr.io/mihohoi0322/hrsystem-employee-service
    newTag: latest
  - name: ghcr.io/mihohoi0322/hrsystem-attendance-service
    newTag: latest
  - name: ghcr.io/mihohoi0322/hrsystem-organization-service
    newTag: latest
